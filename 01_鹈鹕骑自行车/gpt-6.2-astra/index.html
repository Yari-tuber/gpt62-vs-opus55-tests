<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163c3a">
  <title>Pelican Express · 鹈鹕快线</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/three.min.js"></script>
  <script defer src="studio.js"></script>
  <script defer src="coast.js"></script>
  <script defer src="cyclist.js"></script>
  <script defer src="ride.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="brand" viewBox="0 0 52 38">
      <path d="M2 23h12l-4 3H1zm5-6h15l-4 3H5zm7-6h14l-4 3H12z" fill="currentColor"/>
      <path d="M8 31 29 9c3.6-4 6.5-6 10.4-5.5 3 .4 4.6 3 4.1 5.7L51 12l-12.8 1.7-5.4 8.8c-3.3 5.3-7.8 7.5-15 7.5l-3.2 4H9l5.4-6.7z" fill="currentColor"/>
      <path d="m24 21 12-8-7 9.6-7 1.9z" fill="var(--bar)"/>
      <circle cx="39.5" cy="7.9" r="1.2" fill="var(--bar)"/>
    </symbol>
    <symbol id="sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zm12-1q4 4 0 8m3-11q7 7 0 14"/></symbol>
    <symbol id="mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zm13 1 5 5m0-5-5 5"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14A8.5 8.5 0 0 1 10 4a8.5 8.5 0 1 0 10 10z"/></symbol>
    <symbol id="full" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M6 12h12m-6-6v12"/></symbol>
    <symbol id="orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="5" transform="rotate(-26 12 12)"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="m18 3 2 2-2 2"/></symbol>
    <symbol id="side" viewBox="0 0 24 24"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="m5.5 16 4-7 4 7H5.5l8-5 3-1m-2-4h2l2 10M8 8h4"/></symbol>
    <symbol id="mapview" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5zm0 4 9 5 9-5m-18 4 9 5 9-5"/></symbol>
    <symbol id="bell" viewBox="0 0 24 24"><path d="M4 16h16M6 16a6 6 0 1 1 12 0m-6-8V6m-3 13h6M3 8l2 1m14-3 1-2"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-7 7-12a7 7 0 1 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="9" r="2"/></symbol>
  </svg>
  <header class="topbar">
    <div class="identity"><svg class="brandmark"><use href="#brand"/></svg><span>PELAGO</span></div>
    <span class="brandline"></span><span class="club">CYCLING CLUB</span>
    <div class="top-actions">
      <button id="lightBtn" class="tool" title="切换日光与日落" aria-label="切换日落光照" aria-pressed="false"><svg><use href="#sun"/></svg><span>日光</span></button>
      <button id="audioBtn" class="tool" title="开启海岸环境音" aria-pressed="false" aria-label="海岸环境音"><svg><use href="#mute"/></svg><span>环境音</span></button>
      <i></i><button id="fullBtn" class="tool square" aria-label="全屏" title="全屏"><svg><use href="#full"/></svg></button>
    </div>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="鹈鹕骑行微缩模型">
      <div class="chart-grid"></div>
      <svg class="chart-art" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g id="contours"></g></svg>
      <div id="viewport" tabindex="0" aria-label="3D 场景，拖动旋转，滚轮缩放，数字键一至三选择镜头"></div>
      <div class="headline">
        <div class="edition"><i></i> COASTAL SERIES <b>/</b> VOL. 01</div>
        <h1>Pelican<br>Express<span>.</span></h1>
        <div class="subtitle"><span>鹈鹕快线</span><i></i>海岸骑行手记</div>
      </div>
      <aside class="route">
        <div class="route-top"><svg><use href="#pin"/></svg><strong>海角环线</strong><em>R–01</em></div>
        <svg class="route-drawing" viewBox="0 0 148 60" aria-label="环线骑行进度">
          <g class="map-lines"><path d="m-3 52 32-19 4-18L53 1m-37 65 24-24 14-4 7-16L88-4M30 67l22-16 14-5 6-16 18-8 20-25m-9 68 17-18 5-16 28-17m-21 53 4-15 20-12"/></g>
          <path id="routePath" d="M19 39C16 31 30 27 41 29S61 28 67 17S81 9 89 14S94 24 107 22S134 15 132 28S113 43 99 40S81 35 72 43S51 53 43 46S24 49 19 39Z" />
          <circle id="mapDot" cx="19" cy="39" r="4"/>
        </svg>
        <div class="route-bottom"><span>COASTAL LOOP</span><span>2.4 KM</span></div>
      </aside>
      <div class="stage-bottom">
        <div class="hint"><svg><use href="#orbit"/></svg><span class="desktop-hint">拖动旋转<span class="hint-dot">·</span>滚轮缩放</span><span class="touch-hint">拖动旋转 · 双指缩放</span></div>
        <button class="bell" id="bellBtn" title="车铃 (B)"><svg><use href="#bell"/></svg>车铃 <kbd>B</kbd></button>
      </div>
      <div class="fallback" hidden id="fallback" role="alert">此场景需要 WebGL，请在支持硬件加速的浏览器中打开。</div>
    </section>
    <footer class="console">
      <div class="transport"><button class="play-btn" id="playBtn" aria-label="暂停骑行" title="播放 / 暂停（空格）"><svg><use href="#pause"/></svg></button><div><small>RIDE STATUS</small><strong class="ride-state"><i></i><span id="statusText">骑行中</span></strong></div></div>
      <div class="metric speed-metric"><small>时速 <b>/ SPEED</b></small><div><output id="speed">18.6</output><em>km/h</em></div></div>
      <div class="metric time-metric"><small>骑行时间 <b>/ TIME</b></small><div><output id="timer">00:00</output></div></div>
      <div class="pace"><small>骑行倍率</small><div class="stepper"><button id="slower" aria-label="降低骑行倍率"><svg><use href="#minus"/></svg></button><output id="pace">1×</output><button id="faster" aria-label="提高骑行倍率"><svg><use href="#plus"/></svg></button></div></div>
      <div class="views"><small>镜头 <b>/ CAMERA</b></small><div class="view-row" role="group" aria-label="选择镜头">
        <button data-view="0" aria-pressed="true" title="立体视角 (1)"><svg><use href="#orbit"/></svg>立体</button>
        <button data-view="1" aria-pressed="false" title="骑手特写 (2)"><svg><use href="#side"/></svg>特写</button>
        <button data-view="2" aria-pressed="false" title="鸟瞰 (3)"><svg><use href="#mapview"/></svg>鸟瞰</button>
      </div></div>
    </footer>
  </main>
</body>
</html>
