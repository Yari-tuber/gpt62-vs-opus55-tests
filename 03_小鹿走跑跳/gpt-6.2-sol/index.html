<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>林间小鹿 · 森野图鉴</title>
<style>
:root {
  color-scheme: light;
  --paper: #f5f3e9; --ivory: #fcfaf2; --ink: #233627; --muted: #596451;
  --line: #dcded0; --forest: #314737; --lime: #e5edb1;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  color: var(--ink); background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; background: radial-gradient(ellipse at 85% 0, #edefdc, transparent 48%); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, canvas:focus-visible { outline: 2px solid #a4bc62; outline-offset: 4px; }
svg { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.page { width: min(1440px, calc(100% - 100px)); margin: 0 auto; padding-bottom: 30px; }
.masthead { display: flex; align-items: center; justify-content: space-between; min-height: 69px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 11px; font-family: "Songti SC", SimSun, serif; font-size: 16px; letter-spacing: .15em; font-weight: 700; }
.mark { display: grid; width: 34px; height: 34px; place-items: center; color: var(--lime); background: var(--forest); border-radius: 50%; }
.mark svg { width: 21px; height: 21px; }
.intro { display: flex; justify-content: space-between; align-items: end; padding: 21px 0 19px; gap: 20px; }
h1 { margin: 0; font: 700 clamp(38px, 4.3vw, 62px)/1.04 "STSong", "Songti SC", SimSun, serif; letter-spacing: .052em; }
.species { text-align: right; margin-bottom: 2px; }
.species strong { display: block; font-size: 13px; font-weight: 600; letter-spacing: .13em; }
.species i { display: block; color: var(--muted); font: italic 15px Georgia, serif; margin-top: 4px; }
.stage { position: relative; isolation: isolate; overflow: hidden; border-radius: 19px; height: clamp(390px, calc(100svh - 314px), 720px); background: #a5ad7e; box-shadow: 0 14px 34px #293f2916, 0 1px 2px #26352633; }
.stage canvas { position: absolute; width: 100%; height: 100%; inset: 0; display: block; cursor: grab; touch-action: none; }
.stage canvas.dragging { cursor: grabbing; }
.veil { pointer-events: none; position: absolute; inset: 0; background: linear-gradient(180deg,#19291e3c, transparent 23%, transparent 78%,#14271d57), radial-gradient(ellipse at 51% 43%,transparent 57%,#2032232a); }
.stage-top, .stage-bottom { position: absolute; left: 17px; right: 17px; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none; }
.stage-top { top: 16px; align-items: start; }
.stage-bottom { bottom: 16px; }
.glass { background: #203127df; border: 1px solid #f7f8dd38; color: #f7f6e7; box-shadow: 0 3px 11px #19291824; }
.live { border-radius: 10px; min-width: 156px; padding: 10px 13px 9px; }
.live strong { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .11em; }
.live strong::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #d7e69c; box-shadow: 0 0 8px #d7e6978c; flex: none; }
.live span { display: block; color: #dee3ce; font-size: 10px; margin-top: 5px; letter-spacing: .06em; }
.round { pointer-events: auto; display: grid; place-items: center; padding: 0; width: 42px; height: 42px; border-radius: 50%; }
.round:hover { background: #3b5543; }
.help { display: flex; align-items: center; gap: 7px; color: #fffced; font-size: 11px; text-shadow: 0 1px 4px #17241d; letter-spacing: .06em; }
.playback { pointer-events: auto; display: flex; align-items: center; padding: 4px; border-radius: 999px; gap: 1px; }
.playback button { display: grid; place-items: center; border: 0; background: transparent; border-radius: 999px; min-width: 35px; height: 31px; padding: 0 6px; font: 12px Georgia, serif; color: #faf8ec; }
.playback button:hover { background: #c5d2b830; }
.playback button[aria-pressed="true"] { background: var(--lime); color: #253c2c; }
.playback #pause { border-radius: 50%; min-width: 31px; font-size: 15px; margin-right: 3px; }
.playback .play { display: none; }
.playback #pause[aria-pressed="true"] .play { display: block; }
.playback #pause[aria-pressed="true"] .pause { display: none; }
.actions { padding-top: 18px; }
.actions-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
h2 { margin: 0; font: 700 17px/1.2 "Songti SC", SimSun, serif; letter-spacing: .08em; }
.shortcut { font-size: 11px; letter-spacing: .04em; color: var(--muted); }
.action-grid { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 9px; }
.action { display: flex; align-items: center; gap: 9px; min-width: 0; text-align: left; padding: 10px clamp(8px,1.1vw,16px); min-height: 58px; border: 1px solid var(--line); border-radius: 10px; background: var(--ivory); transition: background .2s, border-color .2s, color .2s; font-size: 13px; font-weight: 600; letter-spacing: .05em; }
.action:hover { background: #e9eddb; border-color: #acb59c; }
.action[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); color: #fffdf0; }
.action .glyph { display: grid; place-items: center; width: 31px; height: 31px; flex: none; border-radius: 50%; background: #e9ecdc; color: #465e43; }
.action[aria-pressed="true"] .glyph { background: var(--lime); color: var(--forest); }
.action svg { width: 19px; height: 19px; }
.error { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 30px; text-align: center; background: #263a2a; color: #fffbed; }
.error[hidden] { display: none; }
@media (max-width: 980px) { .page { width: calc(100% - 56px); } .action { gap: 6px; letter-spacing: 0; } }
@media (max-width: 690px) {
  .page { width: calc(100% - 28px); padding-bottom: 18px; }
  .masthead { min-height: 55px; }
  .intro { padding: 18px 0 14px; }
  .species i { font-size: 12px; }
  .species strong { font-size: 11px; letter-spacing: .05em; }
  .stage { height: clamp(380px, 56svh, 590px); border-radius: 13px; }
  .stage-top,.stage-bottom { left: 10px; right: 10px; }
  .stage-top { top: 10px; } .stage-bottom { bottom: 10px; }
  .action-grid { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; }
  .action { min-height: 48px; font-size: 12px; padding: 7px; }
  .action .glyph { width: 26px; height: 26px; }
  .action svg { width: 16px; height: 16px; }
  .actions { padding-top: 14px; }
  .shortcut { display: none; }
  .help { font-size: 10px; }
}
@media (pointer: coarse) { .mouse { display: none; } }
@media (pointer: fine) { .touch { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20C7 15 11 11 18 5M7 17C3 7 12 4 20 4c0 8-4 15-13 13Zm3-3 1-5m2 2 4-1"/></svg></span>森野图鉴</div>
  </header>
  <div class="intro">
    <h1>林间小鹿</h1>
    <div class="species"><strong>梅花鹿 · 幼鹿</strong><i lang="la">Cervus nippon</i></div>
  </div>
  <section class="stage" id="stage" aria-label="小鹿三维展示">
    <canvas id="view" tabindex="0" aria-label="拖动旋转观察小鹿。也可用方向键旋转，加号和减号缩放，Home 键重置视角。"></canvas>
    <div class="veil"></div>
    <div class="stage-top">
      <div class="live glass" role="status" aria-atomic="true"><strong id="motion-name">回头张望</strong><span id="motion-note">转头观察，双耳随动</span></div>
      <button type="button" class="round glass" id="reset" aria-label="重置视角" title="重置视角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2.35 6.28M4 6v5h5M12 9v6m-3-3h6"/></svg></button>
    </div>
    <div class="stage-bottom">
      <div class="help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18m-4-4 4 4-4 4M7 8l-4 4 4 4"/></svg><span class="mouse">拖动旋转 · 滚轮缩放</span><span class="touch">拖动旋转 · 双指缩放</span></div>
      <div class="playback glass" role="group" aria-label="播放控制">
        <button type="button" id="pause" aria-pressed="false" aria-label="暂停播放" title="暂停播放">
          <svg viewBox="0 0 24 24" class="pause" aria-hidden="true"><path d="M9 5v14m6-14v14" stroke-width="2.5"/></svg>
          <svg viewBox="0 0 24 24" class="play" aria-hidden="true"><path d="m9 5 10 7-10 7Z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" data-rate=".5" aria-pressed="false" aria-label="半速">0.5×</button>
        <button type="button" data-rate="1" aria-pressed="true" aria-label="正常速度">1×</button>
        <button type="button" data-rate="1.5" aria-pressed="false" aria-label="一点五倍速">1.5×</button>
      </div>
    </div>
    <div class="error" id="error" hidden>三维画面无法加载，请在支持 WebGL 2 的浏览器中打开。</div>
  </section>
  <section class="actions" aria-labelledby="actions-title">
    <div class="actions-head"><h2 id="actions-title">动作切换</h2><span class="shortcut">数字键 1–6 切换 · 空格暂停</span></div>
    <div class="action-grid" id="actions"></div>
  </section>
</main>

  button.title=option.note;
  button.setAttribute("aria-keyshortcuts",String(i+1));
  button.setAttribute("aria-pressed",String(option.id===requested));
  button.innerHTML=`<span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${option.icon}"/></svg></span><span>${option.name}</span>`;
  button.addEventListener("click",()=>chooseMotion(option.id));
  actionGrid.append(button);
  actionButtons.push(button);
}
function setPaused(value) {
  paused=value;
  pauseButton.setAttribute("aria-pressed",String(paused));
  const label=paused?"继续播放":"暂停播放";
  pauseButton.setAttribute("aria-label",label);
  pauseButton.title=label;
}
setPaused(paused);
pauseButton.addEventListener("click",()=>setPaused(!paused));
rateButtons.forEach(button=>button.addEventListener("click",()=>{
  rate=Number(button.dataset.rate);
  rateButtons.forEach(item=>item.setAttribute("aria-pressed",String(item===button)));
}));
const defaultView={azimuth:.49,elevation:.111,zoom:1};
const view={...defaultView}, goalView={...defaultView};
const follow=V(0,1.035,0);
function resetView() {
  view.azimuth=defaultView.azimuth+fold(view.azimuth-defaultView.azimuth);
  Object.assign(goalView,defaultView);
}
document.querySelector("#reset").addEventListener("click",resetView);
function orbit(dx,dy) {
  goalView.azimuth-=dx*.008;
  goalView.elevation=clamp(goalView.elevation+dy*.007,-.07,1.24);
}
function zoom(factor) {
  goalView.zoom=clamp(goalView.zoom*factor,.61,1.87);
}
const pointers=new Map();
const fingerDistance=()=> {
  const [p,q]=pointers.values();
  return Math.hypot(p.x-q.x,p.y-q.y);
};
canvas.addEventListener("pointerdown",event=>{
  if(event.pointerType==="mouse" && event.button!==0) return;
  canvas.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove",event=>{
  const point=pointers.get(event.pointerId);
  if(!point) return;
  if(pointers.size===1) {
    orbit(event.clientX-point.x,event.clientY-point.y);
    point.x=event.clientX; point.y=event.clientY;
  } else if(pointers.size===2) {
    const before=fingerDistance();
    point.x=event.clientX; point.y=event.clientY;
    if(before>4) zoom(before/Math.max(4,fingerDistance()));
  }
});
function releasePointer(event) {
  pointers.delete(event.pointerId);
  if(!pointers.size) canvas.classList.remove("dragging");
}
for(const event of ["pointerup","pointercancel","lostpointercapture"]) canvas.addEventListener(event,releasePointer);
canvas.addEventListener("wheel",event=>{
  event.preventDefault();
  zoom(Math.exp(clamp(event.deltaY*(event.deltaMode===1?.028:.0015),-.34,.34)));
},{passive:false});
document.addEventListener("keydown",event=>{
  if(event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
  if(/^[1-6]$/.test(event.key)) chooseMotion(motionOptions[Number(event.key)-1].id);
  if(event.code==="Space" && (event.target===document.body || event.target===canvas)) {
    event.preventDefault();
    setPaused(!paused);
  }
  if(event.target!==canvas) return;
  const key=event.key;
  if(key==="ArrowLeft") orbit(-28,0);
  else if(key==="ArrowRight") orbit(28,0);
  else if(key==="ArrowUp") orbit(0,19);
  else if(key==="ArrowDown") orbit(0,-19);
  else if(key==="+" || key==="=") zoom(.91);
  else if(key==="-") zoom(1.1);
  else if(key==="Home") resetView();
  else return;
  event.preventDefault();
});
function sizeViewer() {
  const width=stage.clientWidth, height=stage.clientHeight;
  camera.aspect=width/Math.max(1,height);
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75,Math.sqrt(1900000/(width*height))));
  renderer.setSize(width,height,false);
}
function updateCamera(dt) {
  view.azimuth=damp(view.azimuth,goalView.azimuth,12,dt);
  view.elevation=damp(view.elevation,goalView.elevation,12,dt);
  view.zoom=damp(view.zoom,goalView.zoom,13,dt);
  const cameraRise=jump.active?Math.max(0,jumpBodyHeight(jump.time))*.68:0;
  follow.x=damp(follow.x,worldCenter.x+.15*Math.cos(worldHeading),12,dt);
  follow.z=damp(follow.z,worldCenter.z-.15*Math.sin(worldHeading),12,dt);
  follow.y=damp(follow.y,1.111+cameraRise,8.5,dt);
  const mobileFit=Math.max(5.76,5.48/camera.aspect);
  const radius=mobileFit*view.zoom;
  const horiz=Math.cos(view.elevation)*radius;
  camera.position.set(follow.x+Math.sin(view.azimuth)*horiz,
    Math.max(.18,follow.y+Math.sin(view.elevation)*radius),follow.z+Math.cos(view.azimuth)*horiz);
  camera.lookAt(follow);
  sky.position.copy(camera.position);
  sun.target.position.copy(worldCenter);
  sun.position.copy(worldCenter).addScaledVector(sunDirection,15);
}
let last=0, accumulator=0;
const fixedStep=1/120;
function frame(now) {
  const dt=last===0?1/60:clamp((now-last)/1000,0,.10);
  last=now;
  if(!paused) {
    accumulator+=dt*rate;
    while(accumulator>=fixedStep) {
      animate(fixedStep);
      accumulator-=fixedStep;
    }
    windClock.value=simTime;
    applyPose();
  }
  updateCamera(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
try {
  renderer=new T.WebGLRenderer({ canvas, antialias:true, powerPreference:"high-performance" });
  renderer.setClearColor(0xa7ae82);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=T.PCFShadowMap;
  renderer.toneMapping=T.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.06;
  renderer.outputColorSpace=T.SRGBColorSpace;
  sizeViewer();
  new ResizeObserver(sizeViewer).observe(stage);
  applyPose();
  updateCamera(.5);
  requestAnimationFrame(frame);
  canvas.addEventListener("webglcontextlost",event=>{
    event.preventDefault();
    document.querySelector("#error").hidden=false;
  });
  canvas.addEventListener("webglcontextrestored",()=>{
    document.querySelector("#error").hidden=true;
  });
} catch(error) {
  document.querySelector("#error").hidden=false;
  console.error(error);
}
</script>
</body>
