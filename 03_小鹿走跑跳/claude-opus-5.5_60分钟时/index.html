<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>林间小鹿 · 3D 步态展示</title>
<style>
:root{--ink:#fffaf0;--ink2:rgba(255,250,240,.72);--glass:rgba(28,36,24,.30);--line:rgba(255,255,255,.22);--accent:#ffd27f;--accent2:#ffb35c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9e4dc;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c.drag{cursor:grabbing}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%,rgba(0,0,0,0) 58%,rgba(18,26,14,.38) 100%)}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);box-shadow:0 10px 40px rgba(20,30,10,.22),inset 0 1px 0 rgba(255,255,255,.18)}
.title{position:fixed;left:30px;top:24px;pointer-events:none;text-shadow:0 2px 14px rgba(30,40,20,.45)}
.title h1{margin:0;font-size:30px;font-weight:600;letter-spacing:.18em}
.title h1 span{font-weight:300;opacity:.85}
.title p{margin:6px 0 0;font-size:12.5px;letter-spacing:.32em;color:var(--ink2);text-transform:uppercase}
.bar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:22px}
.btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:82px;padding:10px 0 8px;border:0;border-radius:16px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;transition:background .25s,transform .2s,color .25s}
.btn svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.btn b{font-size:14px;font-weight:500;letter-spacing:.12em}
.btn i{position:absolute;top:6px;right:9px;font-style:normal;font-size:10px;opacity:.45}
.btn:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.btn.on{background:linear-gradient(160deg,rgba(255,226,160,.95),rgba(255,184,98,.92));color:#3b2a12;box-shadow:0 6px 22px rgba(255,170,70,.35)}
.btn.on i{opacity:.6}
.panel{position:fixed;right:24px;top:24px;width:272px;padding:14px 16px 12px;border-radius:18px}
.row{display:flex;align-items:baseline;justify-content:space-between}
.gait{font-size:20px;font-weight:600;letter-spacing:.12em}
.speed{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sub{font-size:11.5px;color:var(--ink2);margin-top:3px;letter-spacing:.06em;min-height:15px}
#diag{display:block;width:240px;height:92px;margin-top:10px;border-radius:10px;background:rgba(0,0,0,.16)}
.cap{font-size:10.5px;color:var(--ink2);margin-top:6px;letter-spacing:.04em;line-height:1.5}
.toggles{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tg{flex:1;min-width:70px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:10px;padding:6px 0;font:inherit;font-size:12px;cursor:pointer;transition:.2s}
.tg:hover{background:rgba(255,255,255,.14)}
.tg.on{background:rgba(255,214,140,.85);color:#3b2a12;border-color:transparent}
.hint{position:fixed;left:30px;bottom:30px;font-size:12px;color:var(--ink2);line-height:1.8;pointer-events:none;text-shadow:0 1px 8px rgba(30,40,20,.5)}
.hint kbd{display:inline-block;min-width:18px;padding:0 5px;margin:0 2px;border-radius:5px;border:1px solid rgba(255,255,255,.35);font:inherit;font-size:11px;text-align:center}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 40%,#f3efe2,#cfdcc8);color:#4b5a3a;transition:opacity 1s ease;z-index:10}
#loader .ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(75,90,58,.18);border-top-color:#7a8f55;animation:spin 1s linear infinite}
#loader p{margin:0;font-size:14px;letter-spacing:.2em}
#loader.err .ring{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:820px){.panel{display:none}.btn{width:56px}.btn b{font-size:12px}.btn i{display:none}.title h1{font-size:22px}.hint{display:none}.bar{bottom:14px;gap:2px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div class="vignette"></div>

<div class="title">
  <h1>林间小鹿 <span>· 梅花鹿</span></h1>
  <p>Sika Deer · Procedural Gait</p>
</div>

<div class="panel glass" id="panel">
  <div class="row"><div class="gait" id="gaitName">慢走</div><div class="speed" id="speed">0.0 km/h</div></div>
  <div class="sub" id="gaitSub">四拍侧对步 · 左后→左前→右后→右前</div>
  <canvas id="diag" width="480" height="184"></canvas>
  <div class="cap">足部着地图（实时）：亮条 = 蹄子踩在地上。蹄子着地时锁定在地面坐标，不会打滑。</div>
  <div class="toggles">
    <button class="tg" id="tgSlow">慢动作</button>
    <button class="tg" id="tgPrint">足迹标记</button>
    <button class="tg" id="tgOrbit">自动环绕</button>
  </div>
</div>

<div class="bar glass" id="bar">
  <button class="btn" data-act="walk"><i>1</i>
    <svg viewBox="0 0 32 32"><path d="M9 25c0-3 1.5-4.5 3-4.5S15 22 15 25"/><path d="M18 14c0-3 1.5-4.5 3-4.5S24 11 24 14"/><path d="M12 20.5v-2M21 9.5v-2"/></svg><b>走</b></button>
  <button class="btn" data-act="trot"><i>2</i>
    <svg viewBox="0 0 32 32"><path d="M6 22c3-6 7-6 10 0s7 6 10 0"/><path d="M8 12h6M11 8h7"/></svg><b>小跑</b></button>
  <button class="btn" data-act="gallop"><i>3</i>
    <svg viewBox="0 0 32 32"><path d="M4 11h9M2 16h10M5 21h8"/><path d="M15 21c3-1 5-5 8-8 2-2 4-2 6-1"/><path d="M17 12c2 0 4 1 5 3"/></svg><b>狂奔</b></button>
  <button class="btn" data-act="leap"><i>4</i>
    <svg viewBox="0 0 32 32"><path d="M4 25c4-14 20-14 24 0"/><path d="M24 21l4 4 2-5"/><path d="M3 27h26" opacity=".5"/></svg><b>跳跃</b></button>
  <button class="btn" data-act="graze"><i>5</i>
    <svg viewBox="0 0 32 32"><path d="M8 27c0-6-2-10-4-12M13 27c0-7 1-12 3-15M19 27c0-5 2-9 5-11M24 27c0-3 1-5 3-6"/><path d="M3 27h26"/></svg><b>吃草</b></button>
  <button class="btn" data-act="look"><i>6</i>
    <svg viewBox="0 0 32 32"><path d="M3 16s5-8 13-8 13 8 13 8-5 8-13 8S3 16 3 16z"/><circle cx="16" cy="16" r="3.5"/><path d="M24 4l3 3-3 3"/></svg><b>张望</b></button>
</div>

<div class="hint">拖动鼠标 绕着看 · 滚轮 缩放 · 双击 复位视角<br>键盘 <kbd>1</kbd>–<kbd>6</kbd> 切换动作 · <kbd>空格</kbd> 慢动作</div>

<div id="loader"><div class="ring"></div><p id="loadMsg">正在载入 three.js …</p></div>

<script type="module">
// ============================================================================
//  林间小鹿 —— three.js 程序化步态演示
//  全部模型、动画、场景均由代码生成；仅从 CDN 载入 three.js 本体。
// ============================================================================
const CDN = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
  'https://unpkg.com/three@0.160.0/build/three.module.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.staticfile.net/three.js/0.160.0/three.module.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
];
let THREE = null;
for (const url of CDN) {
  try { THREE = await import(url); break; } catch (e) { console.warn('three.js 载入失败：', url); }
}
if (!THREE) {
  document.getElementById('loader').classList.add('err');
  document.getElementById('loadMsg').textContent = '无法载入 three.js，请检查网络连接后刷新页面';
  throw new Error('three.js unavailable');
}

// ---------------------------------------------------------------------------
//  小工具
// ---------------------------------------------------------------------------
const V3 = THREE.Vector3, QT = THREE.Quaternion, M4 = THREE.Matrix4;
const PI = Math.PI, TAU = PI * 2, DEG = PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const sstep = (a, b, x) => sm((x - a) / (b - a));
const fract = x => x - Math.floor(x);
const wrapD = d => d - Math.round(d);               // 周期差值 → [-0.5,0.5]
const damp = (c, t, k, dt) => c + (t - c) * (1 - Math.exp(-k * dt));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261118);
const srgb = (hex) => new THREE.Color(hex);       // 颜色（会自动转线性）
// 平滑随机（多正弦叠加）
const wob = (t, s = 0) => Math.sin(t * 1.13 + s) * 0.5 + Math.sin(t * 2.37 + s * 1.7) * 0.3 + Math.sin(t * 4.11 + s * 2.3) * 0.2;
// 周期关键帧曲线（Hermite，有限差分切线）keys: [[phase, a, b, ...], ...]
function cycCurve(keys) {
  const n = keys.length, dim = keys[0].length - 1;
  return (ph, out) => {
    ph = fract(ph);
    let i = n - 1;
    for (let k = 0; k < n; k++) { if (keys[k][0] > ph) { i = k - 1; break; } }
    const i0 = (i + n) % n, i1 = (i0 + 1) % n, im = (i0 - 1 + n) % n, i2 = (i1 + 1) % n;
    const tp = (a, b) => { let d = keys[b][0] - keys[a][0]; if (d <= 0) d += 1; return d; };
    const h = tp(i0, i1); let u = ph - keys[i0][0]; if (u < 0) u += 1; u /= h;
    const hm = tp(im, i0), hp = tp(i1, i2);
    const u2 = u * u, u3 = u2 * u;
    const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
    for (let d = 1; d <= dim; d++) {
      const p0 = keys[i0][d], p1 = keys[i1][d];
      const m0 = (p1 - keys[im][d]) / (h + hm), m1 = (keys[i2][d] - p0) / (h + hp);
      out[d - 1] = h00 * p0 + h10 * h * m0 + h01 * p1 + h11 * h * m1;
    }
    return out;
  };
}
// 非周期关键帧（时间轴，零切线平滑）keys: [[t, a, b...]]
function seqCurve(keys) {
  const n = keys.length, dim = keys[0].length - 1, T = keys[n - 1][0];
  return (t, out) => {
    t = ((t % T) + T) % T;
    let i = 0; while (i < n - 2 && keys[i + 1][0] <= t) i++;
    const a = keys[i], b = keys[i + 1];
    const u = sm((t - a[0]) / Math.max(1e-6, b[0] - a[0]));
    for (let d = 1; d <= dim; d++) out[d - 1] = lerp(a[d], b[d], u);
    return out;
  };
}

// ---------------------------------------------------------------------------
//  渲染器 / 场景 / 相机
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const HORIZON = new THREE.Color().setRGB(0.80, 0.84, 0.80);
scene.fog = new THREE.Fog(HORIZON.clone(), 26, 210);
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 1500);

// 光照：低角度暖阳 + 天空半球光
const SUN_DIR = new V3(-0.62, 0.56, 0.55).normalize();
const hemi = new THREE.HemisphereLight(0xd6e6ff, 0x6b7a45, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe7c4, 3.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
{ const c = sun.shadow.camera; c.left = -4.2; c.right = 4.2; c.top = 4.2; c.bottom = -4.2; c.near = 0.5; c.far = 40; }
sun.shadow.bias = -0.00025; sun.shadow.normalBias = 0.015;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xbfd4ff, 0.45);   // 逆光轮廓补光
scene.add(fill, fill.target);

// 天空穹顶：渐变 + 太阳光晕 + 远山剪影 + 淡云
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: SUN_DIR }, uHor: { value: HORIZON }, uTime: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*p; gl_Position.z = gl_Position.w*0.99999; }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 uSun; uniform vec3 uHor; uniform float uTime;
    float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
    void main(){
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 zen = vec3(0.16,0.36,0.72), mid = vec3(0.42,0.60,0.86);
      vec3 col = mix(uHor, mid, smoothstep(0.0,0.22,h));
      col = mix(col, zen, smoothstep(0.18,0.9,h));
      float sd = max(dot(d,uSun),0.);
      col += vec3(1.0,0.78,0.5)*pow(sd,6.)*0.28 + vec3(1.0,0.85,0.6)*pow(sd,64.)*0.5;
      col += vec3(1.0,0.95,0.85)*smoothstep(0.9993,0.99965,sd)*8.;
      // 云
      if (h > 0.02) {
        vec2 uv = d.xz/(h+0.12)*1.3 + vec2(uTime*0.004, 0.);
        float c = fbm(uv*1.2);
        c = smoothstep(0.52,0.8,c) * smoothstep(0.02,0.25,h);
        vec3 cc = mix(vec3(1.0,0.97,0.92), vec3(0.78,0.80,0.86), smoothstep(0.6,1.0,fbm(uv*2.4+3.)));
        cc += vec3(1.0,0.8,0.55)*pow(sd,4.)*0.4;
        col = mix(col, cc, c*0.85);
      }
      // 远山（两层，带空气透视）
      float az = atan(d.z, d.x);
      float m1 = 0.055 + 0.030*sin(az*2.0+0.6) + 0.018*sin(az*5.3+2.1) + 0.008*sin(az*13.1+0.4) + 0.004*sin(az*29.0);
      float m2 = 0.028 + 0.016*sin(az*3.1+4.0) + 0.010*sin(az*7.7+1.3) + 0.005*sin(az*19.3+2.2);
      vec3 far1 = mix(uHor, vec3(0.50,0.62,0.70), 0.55);
      vec3 far2 = mix(uHor, vec3(0.36,0.50,0.42), 0.55);
      col = mix(col, far1 + vec3(1.,.8,.6)*pow(sd,3.)*0.08, smoothstep(m1+0.002, m1-0.002, h) * smoothstep(-0.02,0.0,h));
      col = mix(col, far2, smoothstep(m2+0.002, m2-0.002, h) * smoothstep(-0.03,0.0,h));
      col = mix(col, uHor, smoothstep(0.012,-0.02,h));
      gl_FragColor = vec4(col,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 24), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

// ---------------------------------------------------------------------------
//  地面 / 草 / 野花 / 树林 / 光尘
// ---------------------------------------------------------------------------
const GLSL_NOISE = `
  float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*vn(p); p=p*2.07+vec2(3.1,7.7); a*=.5; } return s; }
`;
const worldU = { uTime: { value: 0 }, uC: { value: new V3() } };   // 共享：时间、跟随中心

// 地面
const groundMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.97, metalness: 0 });
groundMat.onBeforeCompile = (sh) => {
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
    .replace('#include <project_vertex>', '#include <project_vertex>\nvWP = (modelMatrix*vec4(transformed,1.)).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWP;\n' + GLSL_NOISE)
    .replace('#include <color_fragment>', `#include <color_fragment>
      vec2 gp = vWP.xz;
      float n1 = fbm(gp*0.07), n2 = fbm(gp*0.55+7.0), n3 = vn(gp*4.3);
      vec3 c = mix(vec3(0.050,0.095,0.022), vec3(0.085,0.135,0.032), smoothstep(0.3,0.75,n1));
      c = mix(c, vec3(0.16,0.15,0.06), smoothstep(0.62,0.9,fbm(gp*0.035+11.0))*0.55);
      c *= 0.82 + 0.28*n2 + 0.12*n3;
      diffuseColor.rgb = c;`);
};
const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), groundMat);
ground.rotation.x = -PI / 2; ground.receiveShadow = true;
scene.add(ground);

// 草叶：实例化 + 着色器内环绕平铺（草地无限延伸）
function bladeGeometry() {
  const pos = [], idx = [];
  const L = 5;
  for (let j = 0; j < L; j++) { const y = j / L; pos.push(-0.5, y, 0, 0.5, y, 0); }
  pos.push(0, 1, 0);
  for (let j = 0; j < L - 1; j++) { const a = j * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const a = (L - 1) * 2; idx.push(a, a + 1, L * 2);
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const nrm = []; for (let i = 0; i < pos.length / 3; i++) nrm.push(0, 1, 0);
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setIndex(idx);
  return g;
}
function makeGrass(count, size, hMin, hMax, wMin, wMax, fadeIn, seed) {
  const r = rng(seed);
  const g = bladeGeometry();
  const aP = new Float32Array(count * 4), aS = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    const x = (r() - 0.5) * size, z = (r() - 0.5) * size;
    const clump = 0.5 + 0.5 * Math.sin(x * 0.9 + Math.sin(z * 0.7) * 2.0) * Math.sin(z * 0.8 + x * 0.3);
    const tall = r() < 0.04 ? 1.5 : 1.0;
    aP.set([x, z, r(), r() * TAU], i * 4);
    aS.set([lerp(hMin, hMax, Math.pow(r(), 1.3) * 0.7 + clump * 0.3) * tall, lerp(wMin, wMax, r()), (r() - 0.5) * 0.9, r()], i * 4);
  }
  g.setAttribute('aP', new THREE.InstancedBufferAttribute(aP, 4));
  g.setAttribute('aS', new THREE.InstancedBufferAttribute(aS, 4));
  g.instanceCount = count;
  const m = new THREE.MeshStandardMaterial({ roughness: 0.78, metalness: 0, side: THREE.DoubleSide });
  const U = { uSize: { value: size }, uFadeIn: { value: fadeIn } };
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, worldU, U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute vec4 aP; attribute vec4 aS;
        uniform vec3 uC; uniform float uSize; uniform float uTime; uniform float uFadeIn;
        varying vec3 vG; varying float vY;`)
      .replace('#include <beginnormal_vertex>', `

    if (curve) {
      const u = (k + t) / (n - 1);
      C.copy(curve.getPoint(u)); T.copy(curve.getTangent(u));
    } else {
      C.copy(pts[k]).lerp(pts[k + 1], t);
      T.copy(cpTan[k]).lerp(cpTan[k + 1], sm(t)).normalize();
    }
    L.copy(lat0).addScaledVector(T, -lat0.dot(T)).normalize();
    U.crossVectors(L, T).normalize();
    const w = prof(k, t, 'w'), up = prof(k, t, 'up'), dn = prof(k, t, 'dn'), off = prof(k, t, 'off'), lo = prof(k, t, 'lo');
    // 骨骼权重
    const b0 = cps[k].b ?? 0, b1 = cps[k + 1].b ?? 0;
    const wt = b0 === b1 ? 0 : sm(t);
    for (let j = 0; j < N; j++) {
      const a = -PI / 2 + j / N * TAU;
      const ca = Math.cos(a), sa = Math.sin(a);
      const cx = Math.sign(ca) * Math.pow(Math.abs(ca), e), sy = Math.sign(sa) * Math.pow(Math.abs(sa), e);
      tmp.copy(C).addScaledVector(L, w * cx + lo).addScaledVector(U, off + (sy >= 0 ? up : dn) * sy);
      P.push(tmp.x, tmp.y, tmp.z);
      SI.push(b0, b1, 0, 0); SW.push(1 - wt, wt, 0, 0);
      INFO.push({ u: k + t, a, sy, cx });
    }
    st.c = C.clone(); st.t3 = T.clone(); st.w = w;
  }
  const rings = stations.length;
  const idx = [];
  for (let r = 0; r < rings - 1; r++) for (let j = 0; j < N; j++) {
    const a = r * N + j, b = r * N + (j + 1) % N, c = (r + 1) * N + j, d = (r + 1) * N + (j + 1) % N;
    idx.push(a, c, b, b, c, d);
  }
  // 封口
  const addCap = (st, ringStart, isEnd, bone) => {
    const ci = P.length / 3;
    const cpos = st.c.clone().addScaledVector(st.t3, (isEnd ? 1 : -1) * st.w * 0.25);
    P.push(cpos.x, cpos.y, cpos.z); SI.push(bone, 0, 0, 0); SW.push(1, 0, 0, 0); INFO.push({ u: isEnd ? n - 1 : 0, a: 0, sy: 0, cx: 0, cap: true });
    for (let j = 0; j < N; j++) {
      const a = ringStart + j, b = ringStart + (j + 1) % N;
      if (isEnd) idx.push(ci, b, a); else idx.push(ci, a, b);
    }
  };
  addCap(stations[0], 0, false, cps[0].b ?? 0);
  addCap(stations[rings - 1], (rings - 1) * N, true, cps[n - 1].b ?? 0);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  if (opt.skin) {
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(SI, 4));
    g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(SW, 4));
  }
  // 顶点颜色 & 斑点遮罩
  const col = new Float32Array(P.length), mask = new Float32Array(P.length / 3 * 2);
  const pp = new V3(), nn = new V3(), cc = new THREE.Color();
  const pa = g.attributes.position, na = g.attributes.normal;
  for (let i = 0; i < pa.count; i++) {
    pp.fromBufferAttribute(pa, i); nn.fromBufferAttribute(na, i);
    const res = opt.paint ? opt.paint(pp, nn, INFO[i], cc) : null;
    col[i * 3] = cc.r; col[i * 3 + 1] = cc.g; col[i * 3 + 2] = cc.b;
    if (res) { mask[i * 2] = res[0]; mask[i * 2 + 1] = res[1]; }
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aMask', new THREE.BufferAttribute(mask, 2));
  return g;
}

// 2D 小工具（腿的矢状面内计算）
const dirA = (deg) => new THREE.Vector2(Math.cos(deg * DEG), Math.sin(deg * DEG));

// ---------------------------------------------------------------------------

const mix3 = (out, c, t) => out.lerp(c, clamp(t, 0, 1));

const deer = {};
{
  const D = deer;
  // ---- 关键点（静止姿态）----
  D.bodyPivot = new V3(0, 0.80, 0);
  D.hindPivot = new V3(-0.08, 0.80, 0);
  D.frontPivot = new V3(0.08, 0.80, 0);
  D.neckPts = [new V3(0.47, 0.90, 0), new V3(0.53, 1.02, 0), new V3(0.585, 1.135, 0), new V3(0.63, 1.24, 0)];

  const bones = [];

    const b = new THREE.Bone(); b.name = name; b.userData.rest = rest.clone();

    b.userData.i = bones.length; bones.push(b); return b;
  };
  D.root = mk('root', new V3(0, 0, 0), null);
  D.body = mk('body', D.bodyPivot, D.root);

  fl.virt = (kappa) => { const c = new V2(fl.r, 0).add(new V2(Math.cos(fl.k0 - kappa), Math.sin(fl.k0 - kappa)).multiplyScalar(fl.c)); return { len: c.length(), gam: Math.atan2(c.y, c.x) }; };

      const th = ang(F.clone().sub(S)) + beta;
      const E = S.clone().add(new V2(Math.cos(th), Math.sin(th)).multiplyScalar(fl.h));
      const rA = ang(F.clone().sub(E)) - v0.gam;

  // ---- 着色函数 ----
  const rumpPatch = (p, n) => {   // 臀部白斑 + 黑色描边

const GAITS = {

const GKEYS = ['walk', 'trot', 'gallop', 'leap'];
const gaitFreq = (g, v) => { const G = GAITS[g]; return G.f * clamp(Math.pow(Math.max(v, 0.05) / G.v, 0.38), 0.55, 1.3); };

// ---------------------------------------------------------------------------
//  运动状态
// ---------------------------------------------------------------------------
const GF = { pos: new V3(), yaw: 0, fwd: new V3(1, 0, 0), right: new V3(0, 0, 1) };   // 地面参考系（随身体平移）
const toWorld = (l, out) => out.set(GF.pos.x + GF.fwd.x * l.x + GF.right.x * l.z, l.y, GF.pos.z + GF.fwd.z * l.x + GF.right.z * l.z);
const toLocal = (w, out) => { const dx = w.x - GF.pos.x, dz = w.z - GF.pos.z; return out.set(dx * GF.fwd.x + dz * GF.fwd.z, w.y, dx * GF.right.x + dz * GF.right.z); };
const UPV = new V3(0, 1, 0);

const loco = {

for (const L of deer.legs) {

// 初始相位：按慢走步态
loco.feet.forEach((ft, i) => { ft.phi = GAITS.walk.off[i]; ft.cb = 0; });

function blendGaitParams() {
  const P = loco.P, W = loco.W;
  P.kappa = 0; P.heel = 0; P.scap = 0;
  for (let k = 0; k < 2; k++) { P.fold[k] = 0; P.trail[k] = 0; P.early[k] = 0; }
  for (let i = 0; i < 4; i++) {
    let d = 0, l = 0, sx = 0, sy = 0;
    for (const g of GKEYS) {
      const w = W[g]; if (w <= 0) continue;
      const G = GAITS[g];
      d += w * G.duty[i]; l += w * G.lift[i];
      sx += w * Math.cos(TAU * G.off[i]); sy += w * Math.sin(TAU * G.off[i]);
    }
    P.duty[i] = d; P.lift[i] = l; P.off[i] = Math.atan2(sy, sx) / TAU;
  }
  for (const g of GKEYS) {
    const w = W[g]; if (w <= 0) continue;
    const G = GAITS[g];
    P.kappa += w * G.kappa * DEG; P.heel += w * G.heel * DEG; P.scap += w * G.scap;
    for (let k = 0; k < 2; k++) { P.fold[k] += w * G.fold[k] * DEG; P.trail[k] += w * G.trail[k]; P.early[k] += w * G.early[k]; }
  }
}

// 2 段 IK 辅助：在包含 A、T、且最接近 nAxis 法向的平面内求中间关节
const _d = new V3(), _e = new V3(), _n = new V3(), _q = new QT(), _t1 = new V3(), _t2 = new V3();
function legPlane(A, T, nAxis) {
  _d.subVectors(T, A); const D = _d.length(); _d.multiplyScalar(1 / D);

}
const rotAbout = (v, axis, ang, out) => out.copy(v).applyQuaternion(_q.setFromAxisAngle(axis, ang));

// 写骨骼世界变换：X 轴对准骨方向，Z 轴尽量对准腿平面法向
const _bx = new V3(), _by = new V3(), _bz = new V3(), _bm = new M4();
function setBone(bone, pos, dir, nrm) {
  _bx.copy(dir).normalize();
  _bz.copy(nrm).addScaledVector(_bx, -nrm.dot(_bx)).normalize();
  _by.crossVectors(_bz, _bx);
  _bm.makeBasis(_bx, _by, _bz).multiply(bone.userData.B0inv);
  bone.position.copy(pos);
  bone.quaternion.setFromRotationMatrix(_bm);
}

// 平面角（腿平面：以行进方向为前，竖直向上为上）
const planeDir = (a, out) => out.copy(GF.fwd).multiplyScalar(Math.cos(a)).addScaledVector(UPV, Math.sin(a));
const planeAng = (v) => Math.atan2(v.y, v.x * GF.fwd.x + v.z * GF.fwd.z);

// 求解一条腿：返回各关节世界坐标，并写入骨骼
const _A = new V3(), _S = new V3(), _E = new V3(), _K = new V3(), _St = new V3(), _M = new V3(), _P = new V3();
const _v1 = new V3(), _v2 = new V3(), _v3 = new V3(), _loc = new V3(), _fl = new V3();
const _bodyRight = new V3();
function solveLeg(ft, kappa, scapK) {
  const L = ft.L, B = L.bones, F = ft.F;
  _bodyRight.setFromMatrixColumn(deer.body.matrixWorld, 2).normalize();
  if (L.fore) {
    const fb = deer.frontB, fr = fb.userData.rest;
    // 肩胛骨：绕上端支点随腿摆动而旋转（增加步幅），前肢可在胸廓“吊带”中上下滑动
    const Pl = _v1.copy(L.rest.P).sub(fr);
    _fl.copy(F); fb.worldToLocal(_fl);
    const restA = Math.atan2(L.rest.F.y - L.rest.P.y, L.rest.F.x - L.rest.P.x);
    const curA = Math.atan2(_fl.y - Pl.y, _fl.x - Pl.x);
    const alpha = clamp((curA - restA) * scapK, -0.42, 0.42);
    const sp = L.restSP, ca = Math.cos(alpha), sa = Math.sin(alpha);
    _loc.set(Pl.x + sp.x * ca - sp.y * sa, Pl.y + sp.x * sa + sp.y * ca, Pl.z);

      const fold = P.fold[k] * Math.pow(Math.sin(PI * Math.pow(s, 0.8)), 1.1);
      const aC = cAng + ft.L.r0 - fold;
      const aG = ft.L.a0 - ft.liftHeel * (1 - sm(s / 0.6)) + 0.14 * sstep(0.55, 0.85, s) * (1 - sstep(0.88, 1.0, s));
      const wb = sstep(0.0, 0.25, s) * (1 - sstep(0.7, 0.96, s));
      ft.a = lerp(aG, aC, wb);
    }
    setBone(ft.L.bones.foot, ft.F, planeDir(ft.a, _v1), ft.nrm);
  });
}

// ---------------------------------------------------------------------------
//  相机：鼠标/触摸拖动环绕，滚轮/双指缩放，跟随小鹿
// ---------------------------------------------------------------------------
const CAM0 = { az: 2.25, pol: 1.28, r: 4.4 };
const cam = { az: CAM0.az, pol: CAM0.pol, r: CAM0.r, taz: CAM0.az, tpol: CAM0.pol, tr: CAM0.r, target: new V3(), auto: false, lastInput: 0 };
{
  const ptrs = new Map();
  let pinch0 = 0, r0 = 0;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.classList.add('drag'); cam.lastInput = performance.now();
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); r0 = cam.tr; }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    cam.lastInput = performance.now();
    if (ptrs.size === 1) { cam.taz += dx * 0.0062; cam.tpol = clamp(cam.tpol - dy * 0.005, 0.3, 1.53); }
    else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0 > 0) cam.tr = clamp(r0 * pinch0 / d, 1.4, 14); }
  });
  const up = (e) => { ptrs.delete(e.pointerId); if (!ptrs.size) canvas.classList.remove('drag'); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.tr = clamp(cam.tr * Math.exp(e.deltaY * 0.0011), 1.4, 14); cam.lastInput = performance.now(); }, { passive: false });
  canvas.addEventListener('dblclick', () => { cam.taz = CAM0.az + Math.round((cam.taz - CAM0.az) / TAU) * TAU; cam.tpol = CAM0.pol; cam.tr = CAM0.r; });
}
function updateCamera(dt) {
  if (cam.auto && performance.now() - cam.lastInput > 1500) cam.taz += dt * 0.22;
  cam.az = damp(cam.az, cam.taz, 9, dt); cam.pol = damp(cam.pol, cam.tpol, 9, dt); cam.r = damp(cam.r, cam.tr, 7, dt);
  const graze = sm(ctrl.wGraze);
  cam.target.set(GF.pos.x + 0.08, lerp(0.78, 0.6, graze), GF.pos.z);
  const sp = Math.sin(cam.pol);
  camera.position.set(cam.target.x + cam.r * sp * Math.cos(cam.az), cam.target.y + cam.r * Math.cos(cam.pol), cam.target.z + cam.r * sp * Math.sin(cam.az));
  if (camera.position.y < 0.12) camera.position.y = 0.12;
  camera.lookAt(cam.target);
}

// ---------------------------------------------------------------------------
//  界面
// ---------------------------------------------------------------------------
const ui = {
  btns: [...document.querySelectorAll('.btn')], gait: document.getElementById('gaitName'), sub: document.getElementById('gaitSub'),
  speed: document.getElementById('speed'), diag: document.getElementById('diag'),
  slow: document.getElementById('tgSlow'), print: document.getElementById('tgPrint'), orbit: document.getElementById('tgOrbit'),
};
let timeScale = 1;
function setCmd(c) {
  ctrl.cmd = c;
  ui.btns.forEach(b => b.classList.toggle('on', b.dataset.act === c));
}
ui.btns.forEach(b => b.addEventListener('click', () => setCmd(b.dataset.act)));
const toggleSlow = () => { timeScale = timeScale === 1 ? 0.3 : 1; ui.slow.classList.toggle('on', timeScale !== 1); };
ui.slow.addEventListener('click', toggleSlow);
ui.print.addEventListener('click', () => { printMesh.visible = !printMesh.visible; ui.print.classList.toggle('on', printMesh.visible); });
ui.orbit.addEventListener('click', () => { cam.auto = !cam.auto; ui.orbit.classList.toggle('on', cam.auto); });
const KEYMAP = { '1': 'walk', '2': 'trot', '3': 'gallop', '4': 'leap', '5': 'graze', '6': 'look' };
addEventListener('keydown', (e) => {
  if (KEYMAP[e.key]) setCmd(KEYMAP[e.key]);
  else if (e.code === 'Space') { e.preventDefault(); toggleSlow(); }
});
setCmd('walk');

// 足部着地图
const dctx = ui.diag.getContext('2d');
const HIST_T = 3.0;
const hist = [];   // {t, s:[4]}
let simT = 0;
function drawDiag() {
  const W = ui.diag.width, H = ui.diag.height, c = dctx;
  c.clearRect(0, 0, W, H);
  const names = ['左前', '右前', '左后', '右后'];
  const rowH = 36, top = 18, left = 62, right = W - 12;
  c.font = '22px "PingFang SC","Microsoft YaHei",sans-serif'; c.textBaseline = 'middle';
  for (let r = 0; r < 4; r++) {
    const y = top + r * (rowH + 4);
    c.fillStyle = 'rgba(255,255,255,0.07)'; c.fillRect(left, y, right - left, rowH);
    c.fillStyle = 'rgba(255,250,240,0.8)'; c.fillText(names[r], 8, y + rowH / 2 + 1);
  }
  const t1 = simT, t0 = t1 - HIST_T;
  const xOf = t => left + (t - t0) / HIST_T * (right - left);
  for (let r = 0; r < 4; r++) {
    const y = top + r * (rowH + 4);
    c.fillStyle = '#' + PRINT_COL[r].clone().convertLinearToSRGB().getHexString();
    let start = null;
    for (let k = 0; k < hist.length; k++) {
      const h = hist[k], on = h.s[r];
      if (on && start === null) start = h.t;
      if ((!on || k === hist.length - 1) && start !== null) {
        const x0 = Math.max(left, xOf(start)), x1 = xOf(h.t);
        if (x1 > x0) c.fillRect(x0, y + 5, x1 - x0, rowH - 10);
        start = null;
      }
    }
  }
  c.fillStyle = 'rgba(255,255,255,0.55)'; c.fillRect(right - 2, top - 6, 2, 4 * (rowH + 4) + 4);
}

// ---------------------------------------------------------------------------
//  主循环
// ---------------------------------------------------------------------------
let last = performance.now(), fpsAcc = 0, fpsN = 0, qualityChecked = false, uiT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = Math.min(0.05, (now - last) / 1000); last = now;
  const dt = rdt * timeScale;
  simT += dt;
  ctrl.t += dt;
  updateCtrl(dt);
  // 物理子步：保证高速时落脚点精确
  const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
  const h = dt / steps;
  for (let i = 0; i < steps; i++) updateLoco(h);
  const pose = buildPose(ctrl.t);
  updateBody(dt, pose);
  applyPose(pose);
  deer.root.updateMatrixWorld(true);
  updateLegs();
  // 世界
  worldU.uTime.value += dt; worldU.uC.value.set(GF.pos.x, 0, GF.pos.z);
  skyMat.uniforms.uTime.value = worldU.uTime.value;
  ground.position.set(Math.round(GF.pos.x / 50) * 50, 0, 0);
  updateProps(GF.pos.x);
  updatePrints(dt);
  updateCamera(rdt);
  sky.position.copy(camera.position);
  sun.position.copy(cam.target).addScaledVector(SUN_DIR, 18); sun.target.position.copy(cam.target);
  fill.position.copy(cam.target).add(new V3(4, 3, -6)); fill.target.position.copy(cam.target);
  // 记录着地图
  hist.push({ t: simT, s: loco.feet.map(f => f.stance) });
  while (hist.length && hist[0].t < simT - HIST_T - 0.2) hist.shift();
  uiT += rdt;
  if (uiT > 1 / 30) {
    uiT = 0; drawDiag();
    let g = 'walk', bw = 0; for (const k of GKEYS) if (loco.W[k] > bw) { bw = loco.W[k]; g = k; }
    let name = GAITS[g].name, sub = GAITS[g].sub;
    if (loco.speed < 0.05 && loco.idle) {
      if (ctrl.wGraze > 0.5) { name = '低头吃草'; sub = '颈部逐节弯曲，嘴巴贴着草尖啃食、咀嚼'; }
      else if (ctrl.wLook > 0.5) { name = '回头张望'; sub = '颈椎侧弯 + 头部扭转，双耳转向声源'; }
      else { name = '站立'; sub = '四蹄锁定在地面'; }
    } else if (loco.targetV === 0) { name = '减速停下'; sub = '逐步把四蹄收回到身体下方'; }
    ui.gait.textContent = name; ui.sub.textContent = sub;
    ui.speed.textContent = (loco.speed * 3.6).toFixed(1) + ' km/h';
  }
  renderer.render(scene, camera);
  // 帧率自适应：前几秒过慢时减少草叶数量
  if (!qualityChecked && now > 2500) {
    fpsAcc += rdt; fpsN++;
    if (fpsN >= 90) {
      qualityChecked = true;
      const fps = fpsN / fpsAcc;
      if (fps < 40) { grassNear.geometry.instanceCount = 38000; grassFar.geometry.instanceCount = 20000; renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25)); renderer.setSize(innerWidth, innerHeight, false); }
    }
  }
}
function onResize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', onResize);
// 预先走一小段，让开场就是自然的步态
for (let i = 0; i < 240; i++) { updateCtrl(1 / 60); updateLoco(1 / 60); }
ctrl.t = 4;
updateCamera(1);
requestAnimationFrame((t) => { last = t; frame(t); });
const loader = document.getElementById('loader');
setTimeout(() => { loader.style.opacity = 0; setTimeout(() => loader.remove(), 1100); }, 250);
window.__deer = { deer, loco, ctrl, cam, setCmd, GF };
</script>
