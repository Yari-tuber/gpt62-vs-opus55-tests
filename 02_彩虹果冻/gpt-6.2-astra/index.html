<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#141618">
    <title>软物实验室 · 彩虹果冻</title>
    <style>
      * {
        box-sizing: border-box
      }

      :root {
        color-scheme: dark;
        --bg: #121416;
        --line: #35383b;
        --muted: #a1a5a7;
        --ink: #f3f1eb;
        --amber: #ffc066;
        --mono: "IBM Plex Mono",Consolas,"Courier New",monospace;
        --sans: "DM Sans","Microsoft YaHei UI","Microsoft YaHei",sans-serif
      }

      html,body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        font-family: var(--sans);
        color: var(--ink);
        overflow: hidden
      }

      body {
        display: flex;
        flex-direction: column;
        padding: 0 clamp(14px,2.15vw,36px)
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent
      }

      button:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 4px
      }

      button svg,.icon {
        width: 18px;
        height: 18px;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round
      }

      .header {
        height: 78px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px
      }

      .brand,.header-actions,.live,.reset,.foot,.footgroup,.hint,.tool,.toolrack,.view-controls,.sample-readout,.keyhelp {
        display: flex;
        align-items: center
      }

      .brand {
        gap: 13px
      }

      .lab-mark {
        width: 39px;
        height: 39px;
        color: var(--amber);
        flex: none
      }

      .brand-title {
        font-size: 20px;
        font-weight: 750;
        letter-spacing: .055em;
        line-height: 1.2
      }

      .brand-en {
        font: 9px var(--mono);
        color: #a9aaab;
        letter-spacing: .19em;
        margin-top: 5px
      }

      .header-actions {
        gap: 13px
      }

      .live {
        font-size: 11px;
        color: #b6babb;
        gap: 8px;
        letter-spacing: .06em
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #98d6ad;
        box-shadow: 0 0 8px #83cb9b40
      }

      .vr {
        height: 18px;
        width: 1px;
        background: var(--line);
        margin: 0 3px
      }

      .smallbtn,.reset,.view-controls button {
        background: #1c1e20;
        border: 1px solid #393b3d;
        border-radius: 8px;
        transition: background .15s,border-color .15s
      }

      .smallbtn:hover,.reset:hover,.view-controls button:hover {
        background: #2d2f30;
        border-color: #666
      }

      .smallbtn {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px
      }

      .reset {
        height: 36px;
        gap: 8px;
        padding: 0 13px;
        font-size: 12px;
        font-weight: 600
      }

      .reset svg {
        width: 15px;
        height: 15px
      }

      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        border: 1px solid #3b3d40;
        border-radius: 13px;
        overflow: hidden;
        isolation: isolate;
        background: #1b1e21;
        box-shadow: 0 10px 50px #0002
      }

      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab
      }

      #scene:active {
        cursor: grabbing
      }

      .titleblock {
        position: absolute;
        left: clamp(20px,2.7vw,46px);
        top: clamp(20px,3.5vh,43px);
        pointer-events: none
      }

      .sample-readout {
        gap: 8px;
        color: var(--amber);
        font: 10px var(--mono);
        letter-spacing: .14em
      }

      .sample-readout:before {
        content: "";
        width: 17px;
        height: 2px;
        background: var(--amber)
      }

      h1 {
        font-size: clamp(30px,3.05vw,51px);
        letter-spacing: .04em;
        font-weight: 720;
        margin: 10px 0 6px;
        line-height: 1.22
      }

      .subtitle {
        font: 10px var(--mono);
        letter-spacing: .19em;
        color: #a6a8aa
      }

      .telemetry {
        position: absolute;
        right: clamp(18px,2.6vw,42px);
        top: clamp(22px,3.8vh,46px);
        width: 124px;
        pointer-events: none;
        color: #b4b6b7
      }

      .telehead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        color: #c2c4c5;
        letter-spacing: .08em;
        margin-bottom: 9px
      }

      .telehead svg {
        width: 34px;
        height: 12px;
        stroke: var(--amber);
        fill: none;
        stroke-width: 1.2
      }

      .readrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #ffffff15;
        padding: 7px 0 5px;
        font-size: 11px
      }

      .value {
        font: 12px var(--mono);
        color: #e8e9e7;
        font-variant-numeric: tabular-nums
      }

      .dockarea {
        position: absolute;
        bottom: clamp(18px,3.2vh,38px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 12px;
        max-width: 99%;
        pointer-events: none
      }

      .hint {
        gap: 8px;
        font-size: 12px;
        letter-spacing: .035em;
        color: #d7d7d4;
        white-space: nowrap;
        text-shadow: 0 1px 5px #000
      }

      .hint svg {
        width: 13px;
        height: 13px;
        color: var(--amber)
      }

      .toolrack {
        padding: 6px;
        gap: 4px;
        background: linear-gradient(#292b2d,#202224);
        border: 1px solid #484a4a;
        border-radius: 15px;
        box-shadow: 0 10px 26px #0005,inset 0 1px #ffffff0b;
        pointer-events: auto
      }

      .tool {
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        padding: 0 13px;
        min-width: 107px;
        height: 46px;
        gap: 9px;
        justify-content: center;
        color: #d2d3d3;
        font-size: 13px;
        font-weight: 600;
        transition: background .14s,color .14s
      }

      .tool svg {
        width: 22px;
        height: 22px;
        stroke-width: 1.6
      }

      .tool:hover {
        background: #36383a
      }

      .tool[aria-pressed=true] {
        background: var(--amber);
        border-color: #ffd396;
        box-shadow: inset 0 1px #ffe4ba;
        color: #30251a
      }

      .key {
        font: 10px var(--mono);
        border: 1px solid #ffffff27;
        padding: 1px 4px;
        line-height: 13px;
        border-radius: 4px;
        color: #a8abac
      }

      .tool[aria-pressed=true] .key {
        color: #735328;
        border-color: #97703f66
      }

      .view-controls {
        position: absolute;
        right: 22px;
        bottom: 24px;
        gap: 0;
        border: 1px solid #424548;
        border-radius: 7px;
        overflow: hidden;
        background: #202225
      }

      .view-controls button {
        width: 31px;
        height: 30px;
        border: 0;
        background: transparent;
        border-radius: 0;
        display: grid;
        place-items: center;
        color: #c0c2c3
      }

      .view-controls svg {
        width: 14px;
        height: 14px
      }

      .view-controls button+button {
        border-left: 1px solid #393b3e
      }

      .axis {
        position: absolute;
        left: 26px;
        bottom: 23px;
        color: #999fa2;
        pointer-events: none
      }

      .axis svg {
        width: 54px;
        height: 48px;
        overflow: visible
      }

      .axis text {
        font: 8px var(--mono)
      }

      .foot {
        height: 40px;
        flex: none;
        justify-content: space-between;
        color: #94999c;
        font-size: 10px;
        letter-spacing: .045em
      }

      .footgroup {
        gap: 21px
      }

      .foot span,.keyhelp {
        display: inline-flex;
        align-items: center;
        gap: 7px
      }

      .foot svg {
        width: 13px;
        height: 13px;
        stroke-width: 1.5
      }

      .keyhelp kbd {
        font: 9px var(--mono);
        border: 1px solid #424447;
        border-radius: 4px;
        padding: 2px 5px;
        color: #b9bbbc
      }

      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible
      }

      #cursor {
        position: absolute;
        top: 0;
        left: 0;
        display: none;
        pointer-events: none;
        color: #fff4d8;
        filter: drop-shadow(0 2px 4px #000a)
      }

      #cursor svg {
        width: 32px;
        height: 32px;
        stroke-width: 1.5
      }

      .toast {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translate(-50%,-5px);
        background: #27292bea;
        border: 1px solid #44484a;
        border-radius: 7px;
        padding: 8px 15px;
        font-size: 12px;
        opacity: 0;
        transition: .18s;
        pointer-events: none
      }

      .toast.show {
        transform: translate(-50%,0);
        opacity: 1
      }

      @media(min-width: 1650px) {
        .header {
          height:90px
        }

        .foot {
          height: 48px
        }

        .tool {
          min-width: 124px;
          height: 51px
        }
      }

      @media(max-width: 760px) {
        body {
          padding:0 12px
        }

        .header {
          height: 63px
        }

        .lab-mark {
          width: 31px;
          height: 31px
        }

        .brand {
          gap: 8px
        }

        .brand-title {
          font-size: 16px
        }

        .brand-en {
          font-size: 7px
        }

        .header-actions {
          gap: 7px
        }

        .vr {
          display: none
        }

        .live {
          font-size: 0;
          gap: 0;
          margin: 0 4px
        }

        .reset {
          padding: 0 9px
        }

        .smallbtn,.reset {
          height: 32px
        }

        .smallbtn {
          width: 32px
        }

        .telemetry {
          width: 89px
        }

        .tool {
          min-width: 74px;
          padding: 0 9px;
          gap: 5px
        }

        .tool .key {
          display: none
        }

        .view-controls {
          right: 12px;
          bottom: 118px
        }

        .axis {
          left: 15px;
          bottom: 116px
        }

        .axis svg {
          width: 41px;
          height: 36px
        }

        .footgroup {
          gap: 12px
        }

        .foot {
          height: 31px
        }

        .keyhelp {
          display: none!important
        }

        .toolrack {
          gap: 1px
        }

        .dockarea {
          gap: 10px
        }

        .titleblock {
          left: 18px
        }

        .telehead {
          margin-bottom: 6px
        }
      }

      @media(max-width: 440px) {
        .tool {
          flex-direction:column;
          height: 55px;
          min-width: 66px;
          font-size: 11px;
          gap: 2px
        }

        .tool svg {
          width: 21px;
          height: 21px
        }

        .toolrack {
          padding: 4px;
          border-radius: 12px
        }

        .hint {
          font-size: 11px
        }

        .reset {
          font-size: 11px
        }

        .telemetry {
          width: 73px
        }

        .titleblock h1 {
          font-size: 29px
        }

        .subtitle {
          font-size: 8px
        }

        .foot .wheelhelp {
          display: none
        }
      }

      @media(max-height: 560px) and (min-width:600px) {
        .header {
          height:48px
        }

        .foot {
          height: 24px
        }

        .titleblock,.telemetry {
          top: 14px
        }

        .titleblock h1 {
          font-size: 25px;
          margin: 5px 0
        }

        .dockarea {
          bottom: 7px;
          gap: 3px
        }

        .tool {
          height: 33px
        }

        .toolrack {
          padding: 3px
        }

        .tool svg {
          width: 17px;
          height: 17px
        }

        .hint {
          font-size: 10px
        }

        .view-controls,.axis {
          bottom: 12px
        }
      }
    </style>
  </head>
  <body>
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="hand" viewBox="0 0 24 24">
          <path d="M7.5 12.6 5.7 9.3c-.9-1.6-3-.5-2.4 1l3.5 8a5.4 5.4 0 0 0 5 3.2h1.7a6.5 6.5 0 0 0 6.4-5.9l.5-5.1c.2-1.9-2.1-2.1-2.5-.5l-.6 2.2.1-7c0-1.8-2.5-1.8-2.5 0l-.1 5.6-.5-7.1c-.1-1.8-2.7-1.7-2.6.2l.4 7-1.4-5.4c-.5-1.8-2.8-1.2-2.4.5l.8 4.6"/>
        </symbol>
        <symbol id="knife" viewBox="0 0 24 24">
          <path d="m14.3 10 5-6.5c1.2-1.5 3.4.1 2.1 1.7l-5.2 6.3zM14.3 10l1.9 1.5-5.3 6.6c-1.8 2.2-5 3.4-8.2 3.3z"/>
          <path d="m6.2 19.3 6.6-7.7"/>
        </symbol>
        <symbol id="nail" viewBox="0 0 24 24">
          <path d="m9.8 5.5 8.7 8.7M11 4.3l1.6-1.7 8.8 8.8-1.7 1.6zM12.2 8l3.8 3.8-9 8.1-4 1.1 1.2-4z"/>
        </symbol>
        <symbol id="fire" viewBox="0 0 24 24">
          <path d="M6.2 12.8h10v7.9c0 .8-.6 1.4-1.4 1.4H7.6c-.8 0-1.4-.6-1.4-1.4zM7.5 12.6V9.8h4.7v2.8m1.8-.1V9.2h2.3v3.3"/>
          <path d="M9.6 8.2C6.3 6.1 10.9 4 10.3 1c3.1 2.9 4 5.3.9 7.2"/>
        </symbol>
        <symbol id="reset" viewBox="0 0 24 24">
          <path d="M4 9a8 8 0 1 1-.1 6M4 3.8v5.4h5.4"/>
        </symbol>
        <symbol id="sound" viewBox="0 0 24 24">
          <path d="M3.5 9H7l5-4v14l-5-4H3.5zM15.6 8a5.8 5.8 0 0 1 0 8m2.9-10.5a9.5 9.5 0 0 1 0 13"/>
        </symbol>
        <symbol id="mute" viewBox="0 0 24 24">
          <path d="M3.5 9H7l5-4v14l-5-4H3.5zM16 9l5 6m0-6-5 6"/>
        </symbol>
        <symbol id="mouse" viewBox="0 0 24 24">
          <rect x="5.5" y="2.5" width="13" height="19" rx="6.5"/>
          <path d="M12 6v4"/>
        </symbol>
        <symbol id="orbit" viewBox="0 0 24 24">
          <ellipse cx="12" cy="13" rx="10" ry="5" transform="rotate(-23 12 13)"/>
          <circle cx="12" cy="12" r="2"/>
        </symbol>
        <symbol id="cube" viewBox="0 0 24 24">
          <path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5m-9 5v10"/>
        </symbol>
        <symbol id="minus" viewBox="0 0 24 24">
          <path d="M5 12h14"/>
        </symbol>
        <symbol id="plus" viewBox="0 0 24 24">
          <path d="M5 12h14m-7-7v14"/>
        </symbol>
      </defs>
    </svg>
    <header class="header">
      <div class="brand">
        <svg class="lab-mark" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 17.4c0-1.9 1-3.1 2.8-4.1l11.5-6.4a5.6 5.6 0 0 1 5.4 0l11.5 6.4c1.8 1 2.8 2.2 2.8 4.1v9.9c0 1.9-1.1 3.3-2.8 4.2l-11.5 6.4a5.5 5.5 0 0 1-5.4 0L7.8 31.5A4.6 4.6 0 0 1 5 27.3z"/>
          <path d="m5.6 15.7 13.7 7.6a5.5 5.5 0 0 0 5.4 0l13.7-7.6M5.3 21l14 7.9a5.6 5.6 0 0 0 5.4 0l14-7.9M5.3 26.5l14 7.9a5.6 5.6 0 0 0 5.4 0l14-7.9"/>
        </svg>
        <div>
          <div class="brand-title">软物实验室</div>
          <div class="brand-en">SOFT MATTER LAB</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="live">
          <i class="dot"></i>引擎在线
        </div>
        <i class="vr"></i>
        <button id="audio" class="smallbtn" aria-label="开启音效" title="开启音效" aria-pressed="false">
          <svg>
            <use href="#mute"/>
          </svg>
        </button>
        <button id="resetBtn" class="reset" title="重置场景 (R)">
          <svg>
            <use href="#reset"/>
          </svg>
          重置场景
        </button>
      </div>
    </header>
    <main class="stage" aria-label="三维果冻实验台">
      <canvas id="scene" aria-label="彩虹果冻。选择工具后在果冻上拖动，拖动空白处旋转视角。"></canvas>
      <div class="titleblock">
        <div class="sample-readout">SOFT BODY</div>
        <h1>彩虹果冻</h1>
        <div class="subtitle">RAINBOW GELATIN</div>
      </div>
      <aside class="telemetry">
        <div class="telehead">
          <span>实时状态</span>
          <svg viewBox="0 0 34 12">
            <path id="wave" d="M0 7h34"/>
          </svg>
        </div>
        <div class="readrow">
          <span>果冻块数</span>
          <span class="value" id="pieceCount">01</span>
        </div>
        <div class="readrow">
          <span>植入钉子</span>
          <span class="value" id="pinCount">00</span>
        </div>
      </aside>
      <svg id="overlay" aria-hidden="true">
        <path id="sliceLine" fill="none" stroke="#ffce88" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
      </svg>
      <div id="cursor" aria-hidden="true">
        <svg class="icon">
          <use href="#knife"/>
        </svg>
      </div>
      <div class="axis" aria-hidden="true">
        <svg id="axes" viewBox="0 0 54 48"></svg>
      </div>
      <div class="dockarea">
        <div class="hint" aria-live="polite">
          <svg class="icon">
            <use href="#mouse"/>
          </svg>
          <span id="hint"></span>
        </div>
        <div class="toolrack" role="toolbar" aria-label="实验工具"></div>
      </div>
      <div class="view-controls">
        <button id="zoomOut" aria-label="缩小" title="缩小">
          <svg>
            <use href="#minus"/>
          </svg>
        </button>
        <button id="cameraHome" aria-label="还原视角" title="还原视角">
          <svg>
            <use href="#cube"/>
          </svg>
        </button>
        <button id="zoomIn" aria-label="放大" title="放大">
          <svg>
            <use href="#plus"/>
          </svg>
        </button>
      </div>
      <div class="toast" role="status" id="toast"></div>
    </main>
    <footer class="foot">
      <div class="footgroup">
        <span>
          <svg class="icon">
            <use href="#orbit"/>
          </svg>
          <span id="orbitHint">拖动空白处旋转视角</span>
        </span>
        <span class="wheelhelp">
          <svg class="icon">
            <use href="#mouse"/>
          </svg>
          滚轮缩放
        </span>
      </div>
      <span class="keyhelp">
        <kbd>1 – 4</kbd> 切换工具
      </span>
    </footer>
    <script>
      'use strict';
      const $ = id => document.getElementById(id)
        , canvas = $('scene')
        , TAU = Math.PI * 2;
      const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]]
        , sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]]
        , mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
        , cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]
        , length = a => Math.hypot(...a)
        , norm = a => mul(a, 1 / (length(a) || 1))
        , mix = (a, b, t) => add(mul(a, 1 - t), mul(b, t))
        , clamp = (x, l, h) => Math.max(l, Math.min(h, x))
        , zero = () => [0, 0, 0];
      const toolspec = [['hand', '揉捏', '轻点戳一下，拖动揉捏，松手甩出'], ['knife', '切刀', '按住并划过果冻，沿划线切开'], ['nail', '钉子', '点击果冻表面，把钉子扎进去'], ['fire', '打火机', '按住局部加热，拖动烘烤不同位置']];
      let mode = 0, muted = true, audioCtx, noticeTimer;
      function sound(freq=190, dur=.15, end=.45, type='sine', strength=.075) {
        if (muted)
          return;
        try {
          audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended')
            audioCtx.resume();
          const o = audioCtx.createOscillator()
            , g = audioCtx.createGain()
            , t = audioCtx.currentTime;

          const s = project(d.p);
          c.fillStyle = cssRGB(d.color);
          c.beginPath();
          c.ellipse(s[0], s[1], ppu * d.r, ppu * d.r * (d.speed === undefined ? .34 : 1.3), 0, 0, TAU);
          c.fill()
        }
      }
      let redraw = true
        , frameTime = 0
        , lastHUD = 0
        , waveHistory = Array(22).fill(0)
        , pointerType = 'mouse';
      function setMode(i) {
        if (active)
          endGesture(false);
        mode = i;
        document.querySelectorAll('.tool').forEach( (b, k) => b.setAttribute('aria-pressed', String(k === i)));
        $('hint').textContent = toolspec[i][2];
        $('orbitHint').textContent = i === 1 ? '右键拖动旋转视角' : '拖动空白处旋转视角';
        $('cursor').style.display = 'none';
        $('cursor').querySelector('use').setAttribute('href', '#' + toolspec[i][0]);
        $('sliceLine').setAttribute('d', '');
        redraw = true
      }
      const rack = document.querySelector('.toolrack');
      toolspec.forEach( ([ico,label], i) => {
        const b = document.createElement('button');
        b.className = 'tool';
        b.type = 'button';
        b.title = label + ' (' + (i + 1) + ')';
        b.setAttribute('aria-label', label);
        b.innerHTML = '<svg><use href="#' + ico + '"/></svg><span>' + label + '</span><kbd class="key">' + (i + 1) + '</kbd>';
        b.addEventListener('click', () => setMode(i));
        rack.appendChild(b)
      }
      );
      function reset(show=true) {
        if (active)
          endGesture(false);
        for (const b of pieces)
          freeMesh(b.gpu);
        for (const m of accCache.values())
          freeMesh(m);
        accCache.clear();
        pieces = [initialBody()];
        pins = [];
        flows = [];
        drops = [];
        pools = [];
        heatSpot = null;
        const b = pieces[0];
        updateSurface(b);
        b.settled = true;
        cameraReset();
        setMode(0);
        counts();
        if (show) {
          notice('场景已重置');
          sound(230, .16, 1.5)
        }
        redraw = true
      }
      function cameraReset() {
        zoom = 1;
        yaw = .43;
        pitch = .31;
        camera();
        axes();
        redraw = true
      }
      function changeZoom(f) {
        zoom = clamp(zoom * f, .65, 1.67);
        camera();
        redraw = true
      }
      $('zoomIn').onclick = () => changeZoom(1.13);
      $('zoomOut').onclick = () => changeZoom(1 / 1.13);
      $('cameraHome').onclick = cameraReset;
      $('resetBtn').onclick = () => reset();
      $('audio').onclick = () => {
        muted = !muted;
        const b = $('audio')
          , s = muted ? '开启音效' : '关闭音效';
        b.title = s;
        b.setAttribute('aria-label', s);
        b.setAttribute('aria-pressed', String(!muted));
        b.querySelector('use').setAttribute('href', muted ? '#mute' : '#sound');
        sound(260, .19, 1.25)
      }
      ;
      function localXY(e) {
        const r = canvas.getBoundingClientRect();
        return [e.clientX - r.left, e.clientY - r.top]
      }
      function cursorAt(x, y, h) {
        const custom = pointerType !== 'touch' && mode !== 0 && (h || active?.kind === 'knife' || active?.kind === 'heat');
        canvas.style.cursor = custom ? 'none' : active?.kind === 'orbit' || active?.kind === 'grab' ? 'grabbing' : h ? 'pointer' : 'grab';
        const cur = $('cursor');
        cur.style.display = custom ? 'block' : 'none';
        if (custom) {
          cur.style.transform = 'translate(' + (x - 4) + 'px,' + (y - (mode === 3 ? 5 : 26)) + 'px)';
          cur.style.color = mode === 3 && active?.kind === 'heat' ? '#ffd290' : '#fff2d9'
        }
      }
      canvas.addEventListener('pointerdown', e => {
        if (active || e.button !== 0 && e.button !== 2)
          return;
        const [x,y] = localXY(e)
          , h = hit(x, y);
        pointerType = e.pointerType;
        canvas.setPointerCapture(e.pointerId);
        lastMouse = [x, y];
        const basics = {
          id: e.pointerId,
          x,
          y,
          sx: x,
          sy: y
        };
        redraw = true;
        if (e.button === 2 || e.altKey || (!h && mode !== 1 && mode !== 3)) {
          active = {
            ...basics,
            kind: 'orbit',
            yaw,
            pitch
          };
          cursorAt(x, y, false);
          return
        }
        if (mode === 0 && h) {
          const m = spring(h.b, weighted(h.b.rest, h));
          m.v = mul(h.normal, -3.8);
          m.d = mul(h.normal, -.12);
          m.hold = true;
          m.goal = mul(h.normal, -.075);
          h.b.speed[1] -= .8;
          active = {
            ...basics,
            kind: 'grab',
            b: h.b,
            m,
            contactNormal: h.normal,
            startPoint: h.p,
            startPos: h.b.pos.slice(),
            target: h.p.slice(),
            t: performance.now(),
            release: zero()
          };
          sound(240, .17, .42)
        }
        if (mode === 1)
          active = {
            ...basics,
            kind: 'knife'
          };
        if (mode === 2 && h) {
          placePin(h);
          active = {
            ...basics,
            kind: 'pin'
          }
        }
        if (mode === 3) {
          active = {
            ...basics,
            kind: h ? 'heat' : 'pending',
            b: h?.b,
            h,
            yaw,
            pitch
          };
          if (h)
            sound(110, .16, .5, 'triangle')
        }
        cursorAt(x, y, h);
      }
      );
      canvas.addEventListener('pointermove', e => {
        if (active && e.pointerId !== active.id)
          return;
        pointerType = e.pointerType;
        const [x,y] = localXY(e);
        lastMouse = [x, y];
        let h = null;
        if (active) {
          const a = active;
          redraw = true;
          if (a.kind === 'grab') {
            const target = onViewPlane(x, y, a.startPoint)
              , t = performance.now()
              , dt = clamp((t - a.t) / 1000, .008, .12)
              , instant = mul(sub(target, a.target), 1 / dt);
            a.release = mix(a.release, instant, .53);
            a.target = target;
            a.t = t;
          } else if (a.kind === 'orbit' || a.kind === 'pending') {
            a.kind = 'orbit';
            yaw = a.yaw - (x - a.sx) * .007;
            pitch = clamp(a.pitch + (y - a.sy) * .005, .12, .98);
            camera();
            axes()
          } else if (a.kind === 'knife') {
            $('sliceLine').setAttribute('d', 'M' + a.sx + ' ' + a.sy + 'L' + x + ' ' + y)
          } else if (a.kind === 'heat') {
            h = hit(x, y);
            a.h = h;
            a.b = h?.b
          }
          a.x = x;
          a.y = y;
        } else {
          h = hit(x, y)
        }
        cursorAt(x, y, h || active?.kind === 'grab');
      }
      );
      function endGesture(commit=true) {
        const a = active;
        if (!a)
          return;
        active = null;
        if (a.kind === 'grab') {
          a.m.hold = false;
          let impulse = a.release;
          if (!commit || performance.now() - a.t > 135)
            impulse = zero();
          const scale = Math.min(1, 8.8 / (length(impulse) || 1));
          impulse = mul(impulse, scale);
          a.b.vel = add(mul(a.b.vel, .65), mul(impulse, .61));
          a.b.speed = add(a.b.speed, mul(impulse, .38));
          a.b.spin[2] -= dot(impulse, right) * .10;
          a.b.settled = false;
          if (length(impulse) > 2)
            sound(160, .22, .46)
        }
        if (a.kind === 'knife') {
          if (commit)
            sliceGesture(a);
          $('sliceLine').setAttribute('d', '')
        }
        heatSpot = null;
        redraw = true;
        if (canvas.hasPointerCapture(a.id))
          canvas.releasePointerCapture(a.id);
        if (lastMouse)
          cursorAt(...lastMouse, false);
      }
      canvas.addEventListener('pointerup', e => {
        if (e.pointerId === active?.id) {
          const [x,y] = localXY(e);
          active.x = x;
          active.y = y;
          endGesture(true)
        }
      }
      );
      canvas.addEventListener('lostpointercapture', e => {
        if (active?.id === e.pointerId)
          endGesture(false)
      }
      );
      canvas.addEventListener('pointercancel', () => endGesture(false));
      canvas.addEventListener('pointerleave', () => {
        if (!active) {
          $('cursor').style.display = 'none';
          lastMouse = null
        }
      }
      );
      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        changeZoom(Math.exp(-clamp(e.deltaY, -200, 200) * .0011))
      }
      , {
        passive: false
      });
      canvas.oncontextmenu = e => e.preventDefault();
      window.addEventListener('keydown', e => {
        if (e.altKey || e.ctrlKey || e.metaKey)
          return;
        if (/^[1-4]$/.test(e.key)) {
          setMode(Number(e.key) - 1);
          e.preventDefault()
        } else if (e.key.toLowerCase() === 'r' && !e.repeat)
          reset();
        else if (e.key === 'Escape')
          endGesture(false)
      }
      );
      window.addEventListener('blur', () => endGesture(false));
      function heatOverlay() {
        let fl = $('flameShape');
        if (!fl) {
          fl = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          fl.id = 'flameShape';
          $('overlay').appendChild(fl);
          fl.innerHTML = `
 <defs><linearGradient id="fuel"><stop stop-color="#a85b1d"/><stop offset=".15" stop-color="#ffd58b"/><stop offset=".34" stop-color="#eca851"/><stop offset=".83" stop-color="#d98a38"/><stop offset="1" stop-color="#774827"/></linearGradient><linearGradient id="steel"><stop stop-color="#60696d"/><stop offset=".25" stop-color="#e5e6df"/><stop offset=".5" stop-color="#a3aaab"/><stop offset=".8" stop-color="#58636a"/><stop offset="1" stop-color="#bdc2bf"/></linearGradient><linearGradient id="flame" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ff8528" stop-opacity=".65"/><stop offset=".5" stop-color="#ffd27a"/><stop offset=".76" stop-color="#fff3cd"/><stop offset="1" stop-color="#7ec8ff"/></linearGradient></defs>
 <g id="wick"><path fill="url(#flame)" d="M0 0C2 8 9 13 6 20Q4 25 0 23C-8 20-7 15-4 11Q-1 8 0 0Z"/><path fill="#fff7d7" opacity=".76" d="M0 10Q7 19 2 22Q-3 23-2 19Z"/></g>
 <rect x="-8" y="27" width="22" height="43" rx="5.5" fill="url(#fuel)" stroke="#6b482c" stroke-width=".8"/><rect x="-5.5" y="35.5" width="2" height="27" rx="1" fill="#ffdfad" opacity=".52"/><path d="M-7 65Q0 68 13 65" fill="none" stroke="#925c2d"/>
 <rect x="-8.6" y="23" width="15.4" height="12" rx="2" fill="url(#steel)" stroke="#454e52" stroke-width=".7"/><path d="M-5 28v3m3-3v3m3-3v3" stroke="#526068" stroke-width="1.3"/>
 <circle cx="8" cy="25" r="4.3" fill="#555e61" stroke="#d1d3cb" stroke-width="1"/><circle cx="8" cy="25" r="2.1" fill="#31373a"/><path d="M7 31h6.5v3.5H7" fill="#484746"/>`;
        }
        if (!heatSpot) {
          fl.style.display = 'none';
          return
        }
        const p = project(heatSpot);
        $('cursor').style.display = 'none';
        fl.style.display = '';
        fl.setAttribute('transform', 'translate(' + p[0] + ' ' + p[1] + ') rotate(-28)');
        $('wick').setAttribute('transform', 'translate(0 23) scale(' + (1 + .09 * Math.sin(time * 39)) + ' ' + (1 + .1 * Math.sin(time * 31)) + ') translate(0 -23)')
      }
      function frame(now) {
        const dt = Math.min(.048, Math.max(0, (now - (frameTime || now)) / 1000));
        frameTime = now;
        time += dt;
        const moving = pieces.some(b => !b.settled)
          , liquid = drops.length > 0 || flows.some(f => Math.abs(f.mass * 1.08 - f.extent) > .001 || (f.mass > .47 && f.reserve >= .22))
          , animate = moving || liquid || !!active || pins.some(p => time - p.born < .24);
        if (animate || redraw) {
          if (dt > 0 && (moving || liquid || active?.kind === 'heat')) {
            const steps = dt > .023 ? 2 : 1;
            for (let s = 0; s < steps; s++) {
              meltPhysics(dt / steps);
              physics(dt / steps);
              if (pieces.length > 1)
                resolveContacts()
            }
          }
          if (gl)
            renderGL();
          else
            renderCanvas();
          heatOverlay();
          redraw = false
        }
        if (now - lastHUD > 95) {
          lastHUD = now;
          const energy = pieces.reduce( (s, b) => s + length(b.speed) + length(b.vel) * .4, 0);
          waveHistory.shift();
          waveHistory.push(Math.sin(time * 23) * Math.min(4.6, energy * 1.7) + (active?.kind === 'heat' ? Math.sin(time * 33) : 0));
          $('wave').setAttribute('d', waveHistory.map( (v, i) => (i ? 'L' : 'M') + (i * 33 / (waveHistory.length - 1)).toFixed(1) + ' ' + (6 - v).toFixed(1)).join(''))
        }
        requestAnimationFrame(frame);
      }
      prepareGL();
      resize();
      reset(false);
      new ResizeObserver( () => {
        resize();
        redraw = true
      }
      ).observe(canvas);
      requestAnimationFrame(frame);
    </script>
